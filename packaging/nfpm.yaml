# The .deb of displays, called by packaging/package.sh. Besides the application it sets up the shared
# Icenux APT repository (github.com/Icenux/icenux, by packaging/files/postinst.sh), so later versions
# arrive with the ordinary system update.
name: displays
arch: all
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: Lukas <https://github.com/Icenux/displays>
description: |-
  Terminal UI for managing external monitor layout on Sway and Hyprland.
  Extend or mirror, side, scale, on/off, with persistence across compositor restarts.
vendor: Icenux
homepage: https://github.com/Icenux/displays
license: MIT

depends:
  - bash
  - jq
suggests:
  - wl-mirror

contents:
  - src: displays
    dst: /usr/bin/displays
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/displays/copyright

  # the Icenux package source: the files lie next to the application, postinst.sh puts them in place
  - src: packaging/files/icenux.asc
    dst: /usr/lib/displays/icenux.asc
  - src: packaging/files/icenux.list
    dst: /usr/lib/displays/icenux.list

scripts:
  postinstall: packaging/files/postinst.sh
